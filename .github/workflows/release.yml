# Builds a release binary from a tag and publishes it with its SHA-256.
#
# A binary traceable to a public commit is what stands in for a code-signing
# certificate here, so releases are never built by hand.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      # No shippable binary exists yet; once the exe target lands this step
      # collects it, writes its SHA-256 and attaches both to the release.
      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $binaries = Get-ChildItem -Recurse build -Include *.exe -File
          if (-not $binaries) {
            Write-Host 'No executable target yet; nothing to publish.'
            exit 0
          }
          foreach ($binary in $binaries) {
            Copy-Item $binary.FullName artifacts
            (Get-FileHash $binary.FullName -Algorithm SHA256).Hash |
              Out-File "artifacts\$($binary.Name).sha256" -Encoding utf8
          }

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
